# 本地观测平台，与业务库分离。通过 observability profile 启动。
x-langfuse-env: &langfuse-env
  NEXTAUTH_URL: http://localhost:3100
  NEXTAUTH_SECRET: dev-only-nextauth-secret-change-me
  DATABASE_URL: postgresql://langfuse:langfuse@langfuse-postgres:5432/langfuse
  SALT: dev-only-salt-change-me
  ENCRYPTION_KEY: 22c44ccf410df97681433ee3ed33c57c33d5d88dcae9f3cf20df03284295011e # 生产环境用 openssl rand -hex 32 生成替换
  CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:clickhouse@langfuse-clickhouse:9000
  CLICKHOUSE_URL: http://langfuse-clickhouse:8123
  CLICKHOUSE_USER: clickhouse
  CLICKHOUSE_PASSWORD: clickhouse
  CLICKHOUSE_CLUSTER_ENABLED: 'false'
  REDIS_HOST: langfuse-redis
  REDIS_PORT: '6379'
  REDIS_AUTH: langfuse
  LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
  LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: minio
  LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: miniosecret
  LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://langfuse-minio:9000
  LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: 'true'
  LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
  LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: minio
  LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: miniosecret
  LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://langfuse-minio:9000
  LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: 'true'
  TELEMETRY_ENABLED: 'false'
  LANGFUSE_MIGRATION_V4_WRITE_MODE: 'dual'

services:
  langfuse-postgres:
    image: postgres:17
    profiles: ['observability']
    restart: unless-stopped
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: langfuse
      POSTGRES_DB: langfuse
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - langfuse_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U langfuse']
      interval: 5s
      timeout: 3s
      retries: 10

  langfuse-clickhouse:
    image: clickhouse/clickhouse-server:25.12
    profiles: ['observability']
    restart: unless-stopped
    user: '101:101'
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: clickhouse
    ports:
      - '127.0.0.1:8123:8123'
      - '127.0.0.1:9000:9000'
    volumes:
      - langfuse_clickhouse_data:/var/lib/clickhouse
      - langfuse_clickhouse_logs:/var/log/clickhouse-server
    healthcheck:
      test:
        ['CMD-SHELL', 'wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1']
      interval: 5s
      timeout: 5s
      retries: 10

  langfuse-redis:
    image: redis:7
    profiles: ['observability']
    restart: unless-stopped
    command: '--requirepass langfuse --maxmemory-policy noeviction'
    ports:
      - '127.0.0.1:6378:6379'
    volumes:
      - langfuse_redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', 'langfuse', 'ping']
      interval: 3s
      timeout: 5s
      retries: 10

  langfuse-minio:
    image: minio/minio
    profiles: ['observability']
    restart: unless-stopped
    entrypoint: sh
    command: -c 'mkdir -p /data/langfuse && minio server --address ":9000" --console-address ":9001" /data'
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: miniosecret
    ports:
      - '127.0.0.1:9090:9000'
      - '127.0.0.1:9001:9001'
    volumes:
      - langfuse_minio_data:/data

  langfuse-web:
    image: ghcr.1ms.run/langfuse/langfuse:4
    profiles: ['observability']
    restart: unless-stopped
    depends_on:
      langfuse-postgres:
        condition: service_healthy
      langfuse-clickhouse:
        condition: service_healthy
      langfuse-redis:
        condition: service_healthy
      langfuse-minio:
        condition: service_started
    environment:
      <<: *langfuse-env
      LANGFUSE_INIT_ORG_ID: werewolf
      HOSTNAME: 0.0.0.0
      LANGFUSE_INIT_ORG_NAME: 狼人杀
      LANGFUSE_INIT_PROJECT_ID: werewolf
      LANGFUSE_INIT_PROJECT_NAME: 狼人杀
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:?请配置 Langfuse 公钥}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_SECRET_KEY:?请配置 Langfuse 私钥}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_INIT_USER_EMAIL:?请配置面板管理员邮箱}
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_INIT_USER_PASSWORD:?请配置面板管理员密码}
    ports:
      - '127.0.0.1:3100:3000'
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --spider http://127.0.0.1:3000/api/public/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 10

  langfuse-worker:
    image: ghcr.1ms.run/langfuse/langfuse-worker:4
    profiles: ['observability']
    restart: unless-stopped
    depends_on:
      langfuse-postgres:
        condition: service_healthy
      langfuse-clickhouse:
        condition: service_healthy
      langfuse-redis:
        condition: service_healthy
      langfuse-minio:
        condition: service_started
    environment:
      <<: *langfuse-env
    ports:
      - '127.0.0.1:3030:3030'

volumes:
  langfuse_postgres_data:
  langfuse_clickhouse_data:
  langfuse_clickhouse_logs:
  langfuse_minio_data:
  langfuse_redis_data:
